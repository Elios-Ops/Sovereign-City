<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relic Machine</title>
  <style>
    body {
      margin: 0;
      background: url('images/relic_machine.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Courier New', monospace;
      color: #00ffcc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(1.5px);
    }

    h1 {
      font-size: 2.4rem;
      text-shadow: 0 0 12px #00ffff;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 30px;
      text-shadow: 0 0 6px #00ffff66;
    }

    .relic-btn {
      background: rgba(0, 255, 255, 0.08);
      border: 1px solid #00ffff;
      padding: 14px 30px;
      font-size: 1rem;
      color: #00ffff;
      text-decoration: none;
      border-radius: 6px;
      box-shadow: 0 0 10px #00ffff55;
      transition: all 0.3s ease;
    }

    .relic-btn:hover {
      background: #00ffff33;
      color: black;
      box-shadow: 0 0 16px #00ffffaa;
    }
  </style>
</head>
<body>
  <h1>RELIC MACHINE // INITIATING SLOT SCAN</h1>
  <p>A cryptic control panel hums beneath the chamber. Six slots await.</p>
  <a href="cellar.html" class="relic-btn">🔑 Attempt Slot Access</a>

  <!-- Unified Footer -->
  <script src="unified-footer.js"></script>

</body>
</html>
