  <style>
    html {
      background: #000000;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #000000, #002626);
      background-attachment: fixed;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    h1 {
      font-size: 2em;
      text-shadow: 0 0 10px #00ffcc;
      margin-bottom: 30px;
    }
    .rotating-coin {
      width: 150px;
      animation: rotateY 6s linear infinite;
      transform-style: preserve-3d;
      margin-bottom: 30px;
    }
    @keyframes rotateY {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    .sewer-button {
      padding: 12px 24px;
      font-weight: bold;
      background: #00ffcc;
      color: black;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease;
    }
    .sewer-button:hover {
      transform: scale(1.05);
    }
    
    /* FLOATING PARTICLES */
    #particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #00ffcc;
      border-radius: 50%;
      opacity: 0.7;
      animation: floatUp 10s infinite linear;
      box-shadow: 0 0 4px #00ffcc88;
    }
    
    .particle.cyan { background: #00ffcc; box-shadow: 0 0 4px #00ffcc88; }
    .particle.teal { background: #00ffff; box-shadow: 0 0 4px #00ffff88; }
    .particle.white { background: #ffffff; box-shadow: 0 0 4px #ffffff44; }
    .particle.green { background: #00ff88; box-shadow: 0 0 4px #00ff8888; }
    
    .particle.large { 
      width: 5px; 
      height: 5px; 
      animation-duration: 12s;
    }
    
    .particle.small { 
      width: 2px; 
      height: 2px; 
      animation-duration: 8s;
      opacity: 0.5;
    }
    
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Floating Particles Background -->
  <div id="particles-container"></div>
  
  <h1>$MUSKRAT IS LIVE</h1>
  <img src="images/muskrat_coin_cleaned.png" alt="$MUSKRAT Coin" class="rotating-coin"/>
  
  
  <button class="sewer-button" onclick="window.location.href='poster.html'">ENTER THE SEWER</button>

  <script>
    // FLOATING PARTICLES SYSTEM
    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      // Random colors (green/teal theme)
      const colors = ['cyan', 'teal', 'white', 'green'];
      const sizes = ['small', '', 'large'];
      
      particle.classList.add(colors[Math.floor(Math.random() * colors.length)]);
      particle.classList.add(sizes[Math.floor(Math.random() * sizes.length)]);
      
      // Random position
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (8 + Math.random() * 4) + 's';
      
      document.getElementById('particles-container').appendChild(particle);
      
      // Remove particle after animation
      setTimeout(() => {
        if (particle.parentNode) {
          particle.parentNode.removeChild(particle);
        }
      }, 14000);
    }

    // Generate particles continuously
    function startParticleSystem() {
      setInterval(createParticle, 300);
    }

    // Start particles when page loads
    document.addEventListener('DOMContentLoaded', function() {
      startParticleSystem();
    });
  </script>
  
  <!-- No footer on landing page -->
</body>
</html>
