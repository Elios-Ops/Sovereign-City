<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Codex Manifesto – Dossier Room</title>
  <style>
    body {
      background: #13141b url('images/codex_bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      margin: 0;
      min-height: 100vh;
      text-align: center;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      background: rgba(10,20,25,0.80);
      pointer-events: none;
    }
    .codex-header {
      font-size: 2.2rem;
      letter-spacing: 1px;
      margin-top: 38px;
      margin-bottom: 34px;
      text-shadow: 0 0 14px #00fff8, 0 0 7px #0ff6;
      position: relative;
      z-index: 2;
    }
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
      justify-content: center;
      align-items: center;
      max-width: 1800px;
      margin: 0 auto 40px auto;
      position: relative;
      z-index: 2;
      flex: 1;
    }
    .dossier-folder {
      background: none;
      border: none;
      outline: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.17s;
      position: relative;
      width: 400px;
      height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .dossier-folder img {
      width: 100%;
      max-width: 390px;
      max-height: 440px;
      object-fit: contain;
      filter: drop-shadow(0 0 32px #00fff988);
      transition: filter 0.13s;
      border-radius: 18px;
    }
    .dossier-folder:hover img {
      filter: drop-shadow(0 0 72px #ff00ffa8) brightness(1.10);
      transform: scale(1.03);
    }
    .dossier-folder.locked img {
      filter: grayscale(0.65) blur(1.2px) opacity(0.7);
      pointer-events: none;
    }
    .lock-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff00ff;
      font-size: 3.6rem;
      background: rgba(8,16,32,0.65);
      border-radius: 50%;
      padding: 22px 32px;
      z-index: 2;
      pointer-events: none;
    }
    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(7,20,32,0.97);
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #11191f;
      border: 2.5px solid #ff00ffb8;
      border-radius: 14px;
      color: #fff;
      box-shadow: 0 0 44px #ff00ff55, 0 0 10px #00ffff80;
      width: 96vw;
      max-width: 640px;
      padding: 48px 36px 36px 36px;
      text-align: left;
      position: relative;
      font-family: 'Courier New', monospace;
      min-height: 150px;
      font-size: 1.21rem;
    }
    .close-modal {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 1.7rem;
      color: #ff8fff;
      background: transparent;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-shadow: 0 0 10px #ff00ff99;
    }
    .modal-content h2 {
      color: #00ffff;
      margin-top: 0;
    }
    /* Footer Styles */
    /* Footer styles removed - using unified footer */
    
    
    
    
    
    
    .copyright { width: 100vw; background: rgba(5,5,10,0.95); color: #00ffff; text-align: center; padding: 8px 0; position: fixed; bottom: 0; left: 0; right: 0; font-size: 0.9rem; z-index: 3999; border-top: 1px solid #00ffff22;}
    @media (max-width: 1350px) {
      .codex-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width:900px) {
      .codex-grid { grid-template-columns: 1fr; }
      .dossier-folder { width: 94vw; max-width: 97vw; height: 230px;}
      .dossier-folder img { max-width: 95vw; max-height: 220px;}
    }
    @media (max-width:650px) {
      .codex-header { font-size: 1.22rem; margin-top:16px; }
      .codex-grid { grid-template-columns: 1fr; gap: 28px; }
      .dossier-folder { width: 97vw; max-width: 99vw; height: 120px;}
      .dossier-folder img { max-height: 110px;}
      .footer-nav { font-size: 0.96rem; gap: 8px; flex-direction: column; padding: 22px 0 8px 0;}
      
      body { padding-bottom: 140px;}
      .modal-content {
        padding: 28px 8px 24px 8px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="codex-header">CODEX MANIFESTO — Secret Dossier Room</div>
  <div class="codex-grid">
    <button class="dossier-folder" onclick="openDossier(1)">
      <img src="images/codex/dossier_folder_1.png" alt="Dossier 1">
    </button>
    <button class="dossier-folder" onclick="openDossier(2)">
      <img src="images/codex/dossier_folder_2.png" alt="Dossier 2">
    </button>
    <button class="dossier-folder locked">
      <img src="images/codex/dossier_folder_3.png" alt="Dossier 3 (Locked)">
      <span class="lock-overlay">🔒</span>
    </button>
  </div>

  <!-- Modal for Dossier Detail -->
  <div class="modal-overlay" id="dossierModal">
    <div class="modal-content" id="dossierModalContent">
      <button class="close-modal" id="closeDossierModal" title="Close">&times;</button>
      <div id="dossierModalBody"></div>
    </div>
  </div>

  <!-- MUSKRATS FOOTER -->
    
  <div class="copyright">MuskRats © 2025. All rights reserved.</div>

  <!-- Ambient Audio + Mute Button -->
  <audio id="codexAudio" src="audio/codex_ambience.mp3" loop autoplay></audio>
  <button id="codexMute" style="position:fixed;top:20px;right:20px;z-index:99;background:#090e13;color:#00ffff;padding:10px 16px;border-radius:6px;border:2px solid #00ffffcc;box-shadow:0 2px 18px #00fff8a6;font-size:1.2rem;">🔊</button>

  <script>
    // Modal logic for dossiers
    const dossierModal = document.getElementById('dossierModal');
    const dossierModalBody = document.getElementById('dossierModalBody');
    document.getElementById('closeDossierModal').onclick = () => dossierModal.classList.remove('active');

    function openDossier(id) {
      let html = "";
      if (id === 1) {
        html = `<h2>Dossier Alpha</h2><p>This folder contains classified prophecies, vault glyphs, and the first F.A.M. job. Unlock by owning a MuskRat or by invitation from The Don.</p>`;
      } else if (id === 2) {
        html = `<h2>Dossier Beta</h2><p>Encrypted scrolls, syndicate contacts, and Bloodborn lore. Requires a minimum $MUSKRAT token balance or Crew NFT slot to access.</p>`;
      } else {
        html = `<h2>Classified</h2><p>This dossier is locked. Complete more missions to unlock.</p>`;
      }
      dossierModalBody.innerHTML = html;
      dossierModal.classList.add('active');
    }

    // Close modal on overlay click or ESC
    dossierModal.onclick = function(e) { if (e.target === dossierModal) dossierModal.classList.remove('active'); };
    document.addEventListener('keydown', function(e) { if (e.key === "Escape") dossierModal.classList.remove('active'); });

    // Audio mute/unmute logic
    const codexAudio = document.getElementById('codexAudio');
    const codexMute = document.getElementById('codexMute');
    codexAudio.volume = 0.12;
    codexMute.onclick = () => {
      codexAudio.muted = !codexAudio.muted;
      codexMute.textContent = codexAudio.muted ? "🔇" : "🔊";
    };
  </script>

  <!-- Unified Footer -->
  <script src="unified-footer.js"></script>

</body>
</html>
