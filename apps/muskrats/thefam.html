<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Don Awaits – Choose Your Path</title>
  <style>
    body {
      margin: 0;
      background: url('images/the_dons_office.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Courier New', monospace;
      color: #00ffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(2px);
    }

    h1 {
      font-size: 3rem;
      text-shadow: 0 0 12px #00ffff;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 30px;
      text-shadow: 0 0 8px #00ffff66;
    }

    .btn-container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .path-btn {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #00ffff;
      padding: 14px 28px;
      color: #00ffff;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 6px;
      box-shadow: 0 0 10px #00ffff55;
      transition: all 0.3s ease;
    }

    .path-btn:hover {
      background: #00ffff33;
      color: black;
      box-shadow: 0 0 14px #00ffffaa;
    }
  </style>
</head>
<body>
  <h1>The Don Awaits</h1>
  <p>Will you enter through the Front Door or crawl through the Sewers?</p>

  <div class="btn-container">
    <a href="poster.html" class="path-btn">🐀 Enter the Sewer</a>
    <a href="dossier_lobby.html" class="path-btn">🏛️ Approach the Mansion</a>
  </div>

  <!-- Unified Footer -->
  <script src="unified-footer.js"></script>

</body>
</html>
