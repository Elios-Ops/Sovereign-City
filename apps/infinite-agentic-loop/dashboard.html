<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Infinite Agentic Loop</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Include the same CSS variables and base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-cyan: #00FFFF;
            --electric-pink: #FF0080;
            --matrix-gold: #FFD700;
            --deep-purple: #9D00FF;
            --dark-bg: #0A0A0F;
            --card-bg: rgba(26, 26, 46, 0.95);
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0C3;
            --success-green: #00FF88;
            --warning-red: #FF0044;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            padding: 20px;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: linear-gradient(45deg, var(--primary-cyan), var(--deep-purple));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5);
        }
        
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .dashboard-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary-cyan), var(--deep-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .status-card:hover {
            border-color: var(--primary-cyan);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.2);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .card-icon {
            font-size: 1.5em;
        }
        
        .card-title {
            color: var(--primary-cyan);
            font-weight: 600;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        
        .metric-label {
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .agent-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .agent-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .agent-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            background: var(--success-green);
            color: var(--dark-bg);
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            color: var(--primary-cyan);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(0, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="https://ledger-ai.netlify.app/" class="back-button">
        ← Back to Ledger AI
    </a>
    
    <div class="dashboard-header">
        <h1 class="dashboard-title">🔄 System Dashboard</h1>
        <p style="color: var(--text-secondary);">Real-time monitoring and control center</p>
    </div>
    
    <div class="status-grid">
        <div class="status-card">
            <div class="card-header">
                <span class="card-icon">🤖</span>
                <span class="card-title">Active Agents</span>
            </div>
            <div class="metric-value" id="agentCount">44</div>
            <div class="metric-label">All systems operational</div>
        </div>
        
        <div class="status-card">
            <div class="card-header">
                <span class="card-icon">🔄</span>
                <span class="card-title">Active Loops</span>
            </div>
            <div class="metric-value" id="loopCount">2</div>
            <div class="metric-label">Coordination cycles running</div>
        </div>
        
        <div class="status-card">
            <div class="card-header">
                <span class="card-icon">⚡</span>
                <span class="card-title">Response Time</span>
            </div>
            <div class="metric-value" id="responseTime">0.8s</div>
            <div class="metric-label">Average API response</div>
        </div>
        
        <div class="status-card">
            <div class="card-header">
                <span class="card-icon">🎯</span>
                <span class="card-title">Success Rate</span>
            </div>
            <div class="metric-value" id="successRate">99.2%</div>
            <div class="metric-label">Task completion rate</div>
        </div>
    </div>
    
    <div class="status-card">
        <div class="card-header">
            <span class="card-icon">🤖</span>
            <span class="card-title">Agent Status Overview</span>
        </div>
        <div class="agent-grid" id="agentGrid">
            <!-- Agent cards will be populated by JavaScript -->
        </div>
    </div>
    
    <script>
        const demoAgents = [
            { name: 'MarketAnalysis', category: 'Trading', status: 'Active', llm: 'Gemini' },
            { name: 'StrategyEngine', category: 'Trading', status: 'Active', llm: 'Claude' },
            { name: 'RiskManager', category: 'Trading', status: 'Active', llm: 'GPT-4' },
            { name: 'CodeGenerator', category: 'Development', status: 'Active', llm: 'Claude' },
            { name: 'SecurityAudit', category: 'Infrastructure', status: 'Active', llm: 'Claude' },
            { name: 'DataSync', category: 'Infrastructure', status: 'Active', llm: 'Gemini' },
            { name: 'SystemMonitor', category: 'Infrastructure', status: 'Active', llm: 'GPT-4' },
            { name: 'UIGenerator', category: 'Development', status: 'Active', llm: 'Claude' }
        ];
        
        function populateAgents() {
            const agentGrid = document.getElementById('agentGrid');
            agentGrid.innerHTML = demoAgents.map(agent => `
                <div class="agent-card">
                    <div class="agent-header">
                        <span class="agent-name">${agent.name}</span>
                        <span class="agent-status">${agent.status}</span>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 0.9em;">
                        Category: ${agent.category}<br>
                        LLM: ${agent.llm}
                    </div>
                </div>
            `).join('');
        }
        
        // Simulate real-time updates
        function updateMetrics() {
            const responses = ['0.6s', '0.8s', '0.7s', '0.9s', '0.5s'];
            const rates = ['99.2%', '99.5%', '98.8%', '99.7%', '99.1%'];
            
            document.getElementById('responseTime').textContent = 
                responses[Math.floor(Math.random() * responses.length)];
            document.getElementById('successRate').textContent = 
                rates[Math.floor(Math.random() * rates.length)];
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            populateAgents();
            setInterval(updateMetrics, 5000);
        });
    </script>
</body>
</html>
